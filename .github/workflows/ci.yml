# Continuous integration for the Didit Ruby SDK (docs/DESIGN.md section 11).
# Every action is pinned by full commit SHA; Dependabot keeps the pins current.
# Live smoke tests never run here: they need DIDIT_SANDBOX_API_KEY (see CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs of a pull request; every push to main gets its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        include:
          - os: macos-latest
            ruby: "3.4"
          - os: windows-latest
            ruby: "3.4"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Tests and generator tests
        run: bundle exec rake spec codegen:spec

  jwt-2:
    name: Authentication with jwt 2.x (Ruby 3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read by the Gemfile. The gemspec allows jwt >= 2.7, < 4; the other jobs resolve jwt 3.
      JWT_VERSION: "2.10.2"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby 3.1
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Check that the bundle uses jwt ${{ env.JWT_VERSION }}
        run: |
          version="$(bundle exec ruby -e 'print Gem.loaded_specs.fetch("jwt").version')"
          if [ "$version" != "$JWT_VERSION" ]; then
            echo "::error::The bundle resolved jwt ${version}, expected ${JWT_VERSION}."
            exit 1
          fi
          echo "jwt ${version}"
      - name: Authentication tests
        run: bundle exec rspec spec/authentication

  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rake rubocop

  types:
    name: Types (Steep, Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The Gemfile installs Steep on Ruby 3.3 and newer only.
        ruby: ["3.4", "4.0"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: steep check
        run: bundle exec steep check

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Regenerate and compare with the committed code
        # Fails when lib/didit/resources*, lib/didit/types*, their signatures or spec/generated
        # differ from what codegen/ produces from openapi/. Fix: bundle exec rake generate
        run: bundle exec rake generate:check
      - name: Generator tests
        run: bundle exec rake codegen:spec

  coverage:
    name: Core coverage (90 % minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: RSpec with the line coverage gate of the hand-written core (spec/spec_helper.rb)
        run: COVERAGE=1 bundle exec rspec

  build:
    name: Build and install the gem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build the gem into pkg/
        run: bundle exec rake build
      - name: The package holds only lib/, sig/, README.md, LICENSE and CHANGELOG.md
        run: |
          set -euo pipefail
          gem spec pkg/didit-sdk-*.gem files | tee "$RUNNER_TEMP/files.yml"
          if grep -E '^- (spec|codegen|openapi)/' "$RUNNER_TEMP/files.yml"; then
            echo "::error::The gem contains files from spec/, codegen/ or openapi/ (see didit-sdk.gemspec)."
            exit 1
          fi
          if grep -vE '^(---|- (lib/.+\.rb|sig/.+\.rbs|README\.md|LICENSE|CHANGELOG\.md))?$' "$RUNNER_TEMP/files.yml"; then
            echo "::error::The gem contains files outside lib/, sig/, README.md, LICENSE and CHANGELOG.md."
            exit 1
          fi
          for file in lib/didit.rb lib/didit-sdk.rb lib/didit/version.rb README.md LICENSE; do
            grep -qxF -- "- ${file}" "$RUNNER_TEMP/files.yml" || { echo "::error::${file} is missing from the gem."; exit 1; }
          done
      - name: Install the gem into a clean GEM_HOME and load it
        # Outside the checkout and without Bundler, so only the installed gem and its runtime
        # dependency (jwt) are available.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          export GEM_HOME="$RUNNER_TEMP/clean-gem-home"
          export GEM_PATH="$GEM_HOME"
          gem install --no-document "$GITHUB_WORKSPACE"/pkg/didit-sdk-*.gem
          ruby -e 'require "didit"; puts Didit::VERSION'
          ruby -e 'require "didit-sdk"; Didit::Client; Didit::Webhooks; Didit::Authentication; puts "didit-sdk loads with jwt #{JWT.gem_version}"'

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The official gitleaks-action needs a paid licence for organisations, so the
      # release binary is downloaded and verified against its published SHA-256.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner .'

  agents-md:
    name: CLAUDE.md and AGENTS.md are identical
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cmp CLAUDE.md AGENTS.md
        run: cmp CLAUDE.md AGENTS.md
