# Spec sync (docs/DESIGN.md section 3.1).
#
# Daily and on demand: codegen/spec_sync.rb downloads the upstream OpenAPI documents into
# openapi/ and, when they changed, regenerates the SDK; this workflow then runs every check
# and opens (or updates) the pull request "<type>(spec): sync API spec YYYY-MM-DD" from the
# branch chore/spec-sync. A failed check, or a generator failure (for example a new operation
# without SDK naming), still publishes the pull request, as a draft, and fails the run.
#
# The type follows docs/DESIGN.md sections 3.1 and 13: feat(spec) when a caller can observe
# the change (a minor release, also when it can break typed code), chore(spec) when only
# documentation changed (no release on its own); never "!" and never a BREAKING CHANGE
# footer. The pull request body opens with "Breaking changes" and ends with a
# BEGIN_COMMIT_OVERRIDE block: release-please reads it instead of the commits, so the type,
# and one api(spec) line per breaking change, every one of them, for the release notes section
# "API changes that can break typed code", survive a squash merge with the title. The sync
# commit's message holds the same lines; when they do not fit the description, it leaves the
# block out and asks to squash with that message, which release-please then reads.
#
# The scheduled run syncs the default branch. A manual run started from another branch syncs
# that branch instead, on its own branch chore/spec-sync-<branch>, and opens its pull request
# into that branch, so a change to the sync can be tried before it merges.
#
# Two jobs, so that third-party code never runs next to a token that can write. The sync job
# installs the gems, runs the generator and the checks with a read-only token, commits the
# result locally and hands that commit to the publish job as a git bundle. The publish job
# installs and runs nothing from the repository: it only pushes the commit and opens or
# updates the pull request.
#
# One-time setup by a repository admin:
# - Settings > Actions > General > Workflow permissions: tick "Allow GitHub Actions to create
#   and approve pull requests". Without it the default GITHUB_TOKEN cannot open the pull request.
# - Optional repository secret SPEC_SYNC_TOKEN: a fine-grained personal access token (or a
#   GitHub App token) with Contents and Pull requests read and write on this repository only.
#   Pushes and pull requests made with the default GITHUB_TOKEN start no other workflow, so
#   without it CI does not run on the sync pull request (close and reopen it to start CI).
#
# Commits that people push to chore/spec-sync (docs/DESIGN.md section 15: hand-written changes
# go there) are never overwritten. While the open sync pull request has a commit whose author
# or committer is not github-actions[bot], the sync runs on top of that branch, pushes a plain
# fast-forward, adds its breaking changes and release lines to the description (feat wins over
# chore; codegen/sync_pull_request.rb) and posts its other changes as a comment. Otherwise it
# rebuilds the branch from the default branch and replaces it only if nobody pushed to it
# since this run started
# (--force-with-lease). Nothing is pushed when only openapi/SOURCE.json (the fetch time) differs
# from the branch; the pull request is still opened when none is open, for example after a run
# that pushed the branch but could not open the pull request. Pull requests from forks are
# never taken for the sync pull request.
#
# The push token is only handed to git in the publish job, through GIT_CONFIG_* environment
# variables; it is never written to .git/config.
name: Spec sync

on:
  schedule:
    - cron: "41 6 * * *" # daily, 06:41 UTC
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: spec-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Sync the API spec and run the checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only: this job installs gems and runs the generator and the tests.
    permissions:
      contents: read
      pull-requests: read
    env:
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      base: ${{ steps.base.outputs.base }}
      branch: ${{ steps.base.outputs.branch }}
      mode: ${{ steps.base.outputs.mode }}
      remote_sha: ${{ steps.base.outputs.remote_sha }}
      pr: ${{ steps.base.outputs.pr }}
      failed: ${{ steps.checks.outputs.failed }}
      publish: ${{ steps.commit.outputs.publish }}
      push: ${{ steps.commit.outputs.push }}
    steps:
      - name: Prepare
        # The summary, the commit message and the check results live outside the checkout,
        # so they are never committed; $OUT is what the publish job receives.
        run: |
          {
            echo "OUT=$RUNNER_TEMP/spec-sync"
            echo "SUMMARY=$RUNNER_TEMP/spec-sync-summary.md"
            echo "RELEASE=$RUNNER_TEMP/spec-sync-release.md"
            echo "COMMIT_MESSAGE=$RUNNER_TEMP/spec-sync-commit.txt"
            echo "CHECKS=$RUNNER_TEMP/spec-sync-checks.md"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/spec-sync"

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch, so that the sync branch is known as it was when this run started.
          fetch-depth: 0

      - name: Choose where the sync starts
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The default branch (a scheduled run's event payload has no repository object, so
          # ask). A manual run on another branch syncs that branch on its own sync branch.
          BASE="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          BRANCH=chore/spec-sync
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_TYPE" = branch ] \
            && [ "$GITHUB_REF_NAME" != "$BASE" ]; then
            BASE="$GITHUB_REF_NAME"
            BRANCH="chore/spec-sync-$(printf '%s' "$BASE" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          {
            echo "BASE=$BASE"
            echo "BRANCH=$BRANCH"
          } >> "$GITHUB_ENV"
          git switch --quiet --force-create "$BASE" "origin/$BASE"
          remote_sha="$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" || true)"
          # --head matches the branch name in forks too; only this repository's branch counts.
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" --state open \
            --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')"
          mode="rebuild"
          start="$(git rev-parse "origin/$BASE")"
          if [ -n "$remote_sha" ] && [ -n "$pr" ]; then
            # Authors and committers of the branch commits that the default branch lacks.
            others="$(git log --format='%ae%n%ce' "origin/$BASE..$remote_sha" \
              | grep -v -x -F -e "$BOT_EMAIL" -e '' | sort -u || true)"
            if [ -n "$others" ]; then
              mode="continue"
              start="$remote_sha"
              git switch --quiet --force-create "$BRANCH" "$remote_sha"
              echo "Pull request #$pr has commits by others; this run syncs on top of $BRANCH." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "START=$start" >> "$GITHUB_ENV"
          {
            echo "base=$BASE"
            echo "branch=$BRANCH"
            echo "mode=$mode"
            echo "remote_sha=$remote_sha"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Download the upstream documents and regenerate
        id: sync
        # codegen/spec_sync.rb writes changed=, type= (feat or chore), breaking= and date= to
        # $GITHUB_OUTPUT, the summary (title first) to $SUMMARY and the Release section that ends
        # the pull request body to $RELEASE.
        # Exit 1: a download or input problem, nothing was written (the run fails here).
        # Exit 2: the documents were written but the generator failed; the summary has an
        # "Action needed" section and the pull request is published as a draft.
        run: |
          set -uo pipefail
          code=0
          ruby codegen/spec_sync.rb --summary "$SUMMARY" --release "$RELEASE" --commit-message "$COMMIT_MESSAGE" \
            || code=$?
          for file in "$SUMMARY" "$RELEASE"; do
            if [ -f "$file" ]; then
              { cat "$file"; echo; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          case "$code" in
            0) echo "generator_failed=false" >> "$GITHUB_OUTPUT" ;;
            2)
              echo "generator_failed=true" >> "$GITHUB_OUTPUT"
              echo "::error::The generator failed on the synced documents; see Action needed in the pull request."
              ;;
            *) exit "$code" ;;
          esac

      - name: Run the checks
        id: checks
        if: steps.sync.outputs.changed == 'true'
        env:
          GENERATOR_FAILED: ${{ steps.sync.outputs.generator_failed }}
        run: |
          set -uo pipefail
          failed="$GENERATOR_FAILED"
          printf '\n## Checks\n\n' > "$CHECKS"
          run_check() {
            local name="$1"
            shift
            echo "::group::$name"
            if "$@"; then
              echo "- [x] \`$name\`" >> "$CHECKS"
            else
              echo "- [ ] \`$name\`: **failed**, see the [workflow run]($RUN_URL)" >> "$CHECKS"
              echo "::error::$name failed"
              failed=true
            fi
            echo "::endgroup::"
          }
          # One rake task at a time, so that every check runs even when an earlier one fails.
          for task in generate:check spec codegen:spec rubocop; do
            run_check "bundle exec rake $task" bundle exec rake "$task"
          done
          run_check "bundle exec steep check" bundle exec steep check
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit the sync and write the pull request text
        id: commit
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.base.outputs.mode }}
          REMOTE_SHA: ${{ steps.base.outputs.remote_sha }}
          PR: ${{ steps.base.outputs.pr }}
          SYNC_TYPE: ${{ steps.sync.outputs.type }}
        run: |
          set -euo pipefail
          # A change that mirrors the API is never a major version (docs/DESIGN.md section 13).
          case "$SYNC_TYPE" in
            feat | chore) ;;
            *) echo "::error::The sync reported type '$SYNC_TYPE', want feat or chore."; exit 1 ;;
          esac
          if [ "$(head -n 1 "$COMMIT_MESSAGE")" != "$(head -n 1 "$SUMMARY")" ] \
            || grep -q -E '^BREAKING[ -]CHANGE:' "$COMMIT_MESSAGE"; then
            echo "::error::The sync commit must carry the pull request title, with no '!' and no BREAKING CHANGE footer."
            exit 1
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          if [ "$MODE" = rebuild ]; then
            git switch --quiet --force-create "$BRANCH"
          fi
          # Only the spec copies and the generated layer; nothing else is committed.
          git add --all -- openapi lib sig spec/generated
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --quiet --file "$COMMIT_MESSAGE"

          push=true
          if [ -n "$REMOTE_SHA" ] && git diff --quiet "$REMOTE_SHA" HEAD -- . ':(exclude)openapi/SOURCE.json'; then
            echo "$BRANCH already has this content (only the fetch time in openapi/SOURCE.json differs); nothing to push."
            push=false
          fi
          # The new commit only, on top of the commit it starts from (the publish job has both).
          git bundle create "$OUT/sync.bundle" "^$START" "refs/heads/$BRANCH"

          head -n 1 "$SUMMARY" > "$OUT/title.txt"
          # codegen/spec_sync.rb keeps the summary and the Release section short enough for
          # GitHub's 65,536-character limit on a pull request body or comment (the Release section
          # leaves its block out when the lines do not fit). The Release section, with the block
          # release-please reads, stays last.
          {
            tail -n +3 "$SUMMARY"
            cat "$CHECKS"
            printf '\nPublished by [spec sync run %s](%s).\n\n' "$GITHUB_RUN_ID" "$RUN_URL"
            cat "$RELEASE"
          } > "$OUT/body.md"
          if [ "$MODE" = continue ]; then
            # The open pull request keeps its description: this sync's breaking changes and
            # release lines join it, and its summary goes into a comment.
            gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body > "$RUNNER_TEMP/previous.json"
            ruby codegen/sync_pull_request.rb --previous "$RUNNER_TEMP/previous.json" --body "$OUT/body.md" \
              --commit-message "$COMMIT_MESSAGE" --out "$OUT/continued"
          fi
          {
            echo "publish=true"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"

      - name: Hand the commit to the publish job
        if: steps.commit.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-sync
          path: ${{ runner.temp }}/spec-sync/
          if-no-files-found: error
          retention-days: 7

      - name: Fail the run when a check failed and there is nothing to publish
        if: steps.checks.outputs.failed == 'true' && steps.commit.outputs.publish != 'true'
        run: |
          echo "::error::At least one check failed on the synced documents; see the Checks step."
          exit 1

  publish:
    name: Publish the sync branch and open or update the pull request
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit the bundle starts from may be on any branch.
          fetch-depth: 0

      - name: Receive the commit from the sync job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spec-sync
          path: ${{ runner.temp }}/spec-sync

      - name: Publish the sync branch and open or update the pull request
        env:
          PUSH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN || github.token }}
          BASE: ${{ needs.sync.outputs.base }}
          BRANCH: ${{ needs.sync.outputs.branch }}
          MODE: ${{ needs.sync.outputs.mode }}
          REMOTE_SHA: ${{ needs.sync.outputs.remote_sha }}
          PR: ${{ needs.sync.outputs.pr }}
          PUSH: ${{ needs.sync.outputs.push }}
          FAILED: ${{ needs.sync.outputs.failed }}
        run: |
          set -euo pipefail
          # gh opens the pull request with the same token, so that CI runs on it.
          export GH_TOKEN="$PUSH_TOKEN"
          OUT="$RUNNER_TEMP/spec-sync"
          BODY="$OUT/body.md"
          title="$(cat "$OUT/title.txt")"
          git fetch --quiet "$OUT/sync.bundle" "refs/heads/$BRANCH:refs/spec-sync/commit"

          if [ "$PUSH" = true ]; then
            basic="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
            echo "::add-mask::$basic"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
            if [ "$MODE" = continue ]; then
              # A plain push: it is a fast-forward of the branch, and fails (losing nothing) if
              # someone pushed in the meantime.
              git push origin "refs/spec-sync/commit:refs/heads/$BRANCH"
            else
              # Replaces the branch only while it still points where it did when the sync job
              # started; an empty value means that it must not exist yet.
              git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" origin \
                "refs/spec-sync/commit:refs/heads/$BRANCH"
            fi
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 basic
          fi

          want_draft=false
          if [ "$FAILED" = true ]; then
            want_draft=true
          fi
          if [ -z "$PR" ]; then
            # Also when nothing was pushed: an earlier run may have pushed the branch and then
            # failed to open the pull request.
            draft=()
            if [ "$want_draft" = true ]; then
              draft=(--draft)
            fi
            gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body-file "$BODY" "${draft[@]}"
            exit 0
          fi
          if [ "$PUSH" != true ]; then
            echo "Pull request #$PR already has this content."
            exit 0
          fi
          if [ "$MODE" = continue ]; then
            # The sync job merged this sync's breaking changes and release lines into the
            # description (feat wins over chore); its other changes go into a comment.
            gh pr edit "$PR" --title "$(head -n 1 "$OUT/continued/title.txt")" \
              --body-file "$OUT/continued/body.md"
            gh pr comment "$PR" --body-file "$OUT/continued/comment.md"
          else
            gh pr edit "$PR" --title "$title" --body-file "$BODY"
          fi
          is_draft="$(gh pr view "$PR" --json isDraft --jq '.isDraft')"
          if [ "$want_draft" = true ] && [ "$is_draft" = false ]; then
            gh pr ready "$PR" --undo
          elif [ "$want_draft" = false ] && [ "$is_draft" = true ] && [ "$MODE" = rebuild ]; then
            gh pr ready "$PR"
          fi

      - name: Fail the run when a check failed
        if: needs.sync.outputs.failed == 'true'
        run: |
          echo "::error::The spec sync pull request was published as a draft, but at least one check failed; see its Checks section."
          exit 1
