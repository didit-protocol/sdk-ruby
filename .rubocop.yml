plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # Generated code: checked by its generator tests, Ruby's own syntax check and Steep.
    - "lib/didit/resources/**/*"
    - "lib/didit/resources.rb"
    - "lib/didit/types/**/*"
    - "lib/didit/types.rb"
    - "spec/generated/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Exclude:
    - "spec/**/*"
    - "codegen/test/**/*"
    - "examples/**/*"

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 300

Metrics/ModuleLength:
  Max: 300

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "codegen/test/**/*"
    - "*.gemspec"
    - "Rakefile"

Naming/FileName:
  Exclude:
    - "lib/didit-sdk.rb"

RSpec/ExampleLength:
  Max: 30

RSpec/MultipleExpectations:
  Max: 12

RSpec/NestedGroups:
  Max: 4

RSpec/MultipleMemoizedHelpers:
  Max: 10
